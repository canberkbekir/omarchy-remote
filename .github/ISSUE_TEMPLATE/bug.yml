name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: pc-remote doctor
      description: Paste the output of `pc-remote doctor`.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `pc-remote version`.
      placeholder: v0.1.2
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and browser
      placeholder: iPhone 15, Safari, added to Home Screen
  - type: textarea
    id: pc
    attributes:
      label: PC details
      description: Only what's related, such as monitors (for brightness), game and Steam (for the controller), or how you connect (home Wi-Fi or Tailscale).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl --user -u pc-remote-web -n 50`"
      render: text
