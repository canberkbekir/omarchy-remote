name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # Linux-only changes must not break the Windows build.
      - run: GOOS=windows go vet ./...
      # Compiles every package's test binary without running it.
      - run: GOOS=windows go test -exec true ./...
