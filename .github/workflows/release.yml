name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # ViGEmClient is archived; this is its last commit. Its DLL lets the
  # Windows server drive ViGEmBus virtual controllers.
  VIGEM_CLIENT_REF: b66d02d57e32cc8595369c53418b843e958649b4
  # The Windows installer is built with Inno Setup and bundles the ViGEmBus
  # driver's installer; both are pinned by hash.
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
  INNO_SETUP_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c
  VIGEMBUS_URL: https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe
  VIGEMBUS_SHA256: 89220a7865076b342892f98865f3499fb7c4cfd673159e89d352c360fd014c6a

jobs:
  # Builds third-party code, so it gets only the read-only token.
  vigem-client:
    runs-on: windows-latest
    steps:
      - name: Build ViGEmClient.dll
        shell: pwsh
        # Its CMake builds the DLL without exports; these make Client.h
        # mark the API dllexport.
        env:
          CL: /DVIGEM_DYNAMIC /DVIGEM_EXPORTS
        run: |
          git init vigem
          git -C vigem fetch --depth 1 https://github.com/nefarius/ViGEmClient.git $env:VIGEM_CLIENT_REF
          git -C vigem checkout FETCH_HEAD
          if ((git -C vigem rev-parse HEAD) -ne $env:VIGEM_CLIENT_REF) { throw "fetched the wrong ViGEmClient commit" }
          # Static C runtime, so the DLL loads without the VC++ redistributable.
          cmake -S vigem -B vigem/build -A x64 -DViGEmClient_DLL=ON `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build vigem/build --config Release --target ViGEmClientShared
          New-Item -ItemType Directory out | Out-Null
          Copy-Item vigem/build/Release/ViGEmClient.dll out/
          Copy-Item vigem/LICENSE out/ViGEmClient-LICENSE.txt
      - name: Check the DLL exports the client API
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $exports = & $dumpbin.FullName /exports out/ViGEmClient.dll | Out-String
          foreach ($name in 'vigem_alloc', 'vigem_connect', 'vigem_target_x360_alloc', 'vigem_target_add', 'vigem_target_x360_update', 'vigem_target_remove', 'vigem_target_free') {
            if ($exports -notmatch "\b$name\b") { throw "ViGEmClient.dll doesn't export $name" }
          }
          $deps = & $dumpbin.FullName /dependents out/ViGEmClient.dll | Out-String
          if ($deps -match '(?i)vcruntime|msvcp') { throw "ViGEmClient.dll needs the VC++ redistributable:`n$deps" }
      - uses: actions/upload-artifact@v4
        with:
          name: vigem-client
          path: out/

  build:
    needs: vigem-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: actions/download-artifact@v4
        with:
          name: vigem-client
          path: vigem
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            name="omarchy-remote-linux-$arch"
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "dist/$name/pc-remote-web" .
            install -m 755 scripts/pc-remote "dist/$name/"
            install -m 644 systemd/pc-remote-web.service LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          name=pc-remote-windows-amd64
          mkdir "dist/$name"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "dist/$name/pc-remote-web.exe" .
          cp vigem/ViGEmClient.dll vigem/ViGEmClient-LICENSE.txt LICENSE README.md "dist/$name/"
          (cd dist && zip -q -r -X "$name.zip" "$name")
          cp install.sh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.sh
            dist/pc-remote-windows-amd64/

  # Runs third-party installers, so it gets only the read-only token.
  windows-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Get Inno Setup and the ViGEmBus installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory tools | Out-Null
          function Get-Pinned($url, $sha, $file) {
            Invoke-WebRequest $url -OutFile $file
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $sha) { throw "$file doesn't match its pinned hash" }
          }
          Get-Pinned $env:INNO_SETUP_URL $env:INNO_SETUP_SHA256 tools/innosetup.exe
          Get-Pinned $env:VIGEMBUS_URL $env:VIGEMBUS_SHA256 tools/ViGEmBusSetup.exe
          Start-Process tools/innosetup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$PWD\tools\inno" -Wait
          if (-not (Test-Path tools/inno/ISCC.exe)) { throw "Inno Setup didn't install" }
      - name: Build PCRemoteSetup.exe
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & tools/inno/ISCC.exe "/DAppVersion=$version" "/DSourceDir=$PWD\dist\pc-remote-windows-amd64" `
            "/DViGEmBusSetup=$PWD\tools\ViGEmBusSetup.exe" packaging/windows/pc-remote.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/PCRemoteSetup.exe

  publish:
    needs: [build, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz *.zip PCRemoteSetup.exe install.sh > checksums.txt
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes \
            *.tar.gz *.zip PCRemoteSetup.exe install.sh checksums.txt
