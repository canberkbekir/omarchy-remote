<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join the game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0F0C">
<link rel="icon" href="/icon-180.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/user.css">
</head>
<body>

<form class="screen join" id="join" hidden>
  <div class="join-head">
    <div class="join-icon" aria-hidden="true">
      <svg class="i" viewBox="0 0 24 24"><path d="M6 11h4"/><path d="M8 9v4"/><path d="M15 12h.01"/><path d="M18 10h.01"/><path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59C2.6 9.42 2 14.46 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.41.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.55-.6-6.58-.69-7.26A4 4 0 0 0 17.32 5z"/></svg>
    </div>
    <h1>Join the game</h1>
    <p class="join-pc" id="join-pc"></p>
  </div>

  <div class="join-field">
    <label for="code">Code from the host</label>
    <input class="join-code" id="code" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="code-help">
    <p class="join-help" id="code-help" aria-live="polite">4 letters. Ask the host for it.</p>
  </div>

  <div class="join-field">
    <label for="name">Your name</label>
    <input class="join-name" id="name" type="text" maxlength="20" placeholder="So the host knows who you are" autocomplete="nickname">
  </div>

  <div class="join-actions">
    <button class="primary" type="submit" id="join-button" disabled>Join</button>
    <p class="join-note">Works on the same Wi-Fi as the PC</p>
  </div>
</form>

<section class="screen joined" id="joined" aria-label="Joined" hidden>
  <div class="joined-main">
    <div class="joined-badge" id="joined-badge">P2</div>
    <div class="joined-text">
      <h1 id="joined-title">You’re Player 2</h1>
      <p id="joined-hello"></p>
    </div>
    <button class="key" type="button" id="joined-open">Open controller</button>
    <p class="join-note">For when rotation lock is on</p>
    <p class="state joined-state"><span class="dot off" id="joined-dot" aria-hidden="true"></span><span id="joined-status" aria-live="polite">Connecting</span></p>
  </div>
  <button class="joined-leave" type="button" id="leave">Leave game</button>
</section>

<script src="/gamepad.js"></script>
<script src="/join.js"></script>
</body>
</html>
