<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join the game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0F0C">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/user.css">
</head>
<body>

<form class="screen join" id="join" hidden>
  <div class="join-head">
    <div class="join-icon" aria-hidden="true">
      <svg class="i" viewBox="0 0 24 24"><path d="M6 11h4"/><path d="M8 9v4"/><path d="M15 12h.01"/><path d="M18 10h.01"/><path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59C2.6 9.42 2 14.46 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.41.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.55-.6-6.58-.69-7.26A4 4 0 0 0 17.32 5z"/></svg>
    </div>
    <h1>Join the game</h1>
    <p class="join-pc" id="join-pc"></p>
  </div>

  <div class="join-field">
    <label for="code">Code from the host</label>
    <input class="join-code" id="code" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="code-help">
    <p class="join-help" id="code-help" aria-live="polite">4 letters. Ask the host for it.</p>
  </div>

  <div class="join-field">
    <label for="name">Your name</label>
    <input class="join-name" id="name" type="text" maxlength="20" placeholder="So the host knows who you are" autocomplete="nickname">
  </div>

  <div class="join-actions">
    <button class="primary" type="submit" id="join-button" disabled>Join</button>
    <p class="join-note">Works on the same Wi-Fi as the PC</p>
  </div>
</form>

<section class="screen joined" id="joined" aria-label="Joined" hidden>
  <div class="joined-main">
    <div class="joined-badge" id="joined-badge">P2</div>
    <div class="joined-text">
      <h1 id="joined-title">You’re Player 2</h1>
      <p id="joined-hello"></p>
    </div>
    <button class="key" type="button" id="joined-open">Open controller</button>
    <p class="join-note">For when rotation lock is on</p>
    <p class="state joined-state"><span class="dot off" id="joined-dot" aria-hidden="true"></span><span id="joined-status" aria-live="polite">Connecting</span></p>
  </div>
  <button class="joined-leave" type="button" id="leave">Leave game</button>
</section>

<script src="/gamepad.js"></script>
<script>
// The guest page: join with the host's code, then play as player 2, 3 or 4.
// After joining, the token is kept on this phone, so reopening the page or
// reconnecting keeps the same player until the host ends the party.
const $ = (id) => document.getElementById(id);
const STORAGE_KEY = 'pc-remote-guest';
const CODE_LETTERS = /[^A-HJ-NP-Z]/g; // no I or O, like the codes themselves
const ENDED = {
  removed: 'The host removed you from the game.',
  ended: 'The host ended the game.',
};

function loadGuest() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) ?? 'null');
  } catch {
    return null;
  }
}

function saveGuest(value) {
  try {
    if (value) localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
    else localStorage.removeItem(STORAGE_KEY);
  } catch {}
}

let guest = loadGuest();

function setHelp(text, problem = false) {
  $('code-help').textContent = text;
  $('code-help').classList.toggle('problem', problem);
  $('code').classList.toggle('problem', problem);
}

function syncJoinButton() {
  $('join-button').disabled = $('code').value.length !== 4 || !$('name').value.trim();
}

function showJoin(message) {
  $('joined').hidden = true;
  $('join').hidden = false;
  if (message) setHelp(message, true);
  syncJoinButton();
  pad.sync();
}

function showJoined() {
  $('join').hidden = true;
  $('joined').hidden = false;
  $('joined-badge').textContent = `P${guest.slot}`;
  $('joined-title').textContent = `You’re Player ${guest.slot}`;
  $('joined-hello').textContent = `Hi ${guest.name}! Turn your phone sideways to play.`;
  pad.sync();
}

const pad = setupGamepad({
  socketPath: '/api/play',
  credential: () => guest?.token ?? '',
  player: () => guest?.slot ?? '',
  isActive: () => !!guest && !$('joined').hidden,
  canEdit: false,
  onStatus: ({ ready, connecting }) => {
    $('joined-status').textContent = ready ? 'Connected' : (connecting ? 'Connecting' : 'Offline');
    $('joined-dot').classList.toggle('off', !ready);
  },
  onEnded: (reason) => {
    if (!guest) return; // this phone left on its own
    guest = null;
    saveGuest(null);
    $('code').value = '';
    showJoin(ENDED[reason] ?? ENDED.ended);
  },
});

$('code').addEventListener('input', () => {
  $('code').value = $('code').value.toUpperCase().replace(CODE_LETTERS, '').slice(0, 4);
  setHelp('4 letters. Ask the host for it.');
  syncJoinButton();
});
$('name').addEventListener('input', syncJoinButton);

$('join').addEventListener('submit', async (event) => {
  event.preventDefault();
  $('join-button').disabled = true;
  try {
    const response = await fetch('/api/join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: $('code').value, name: $('name').value }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      setHelp(data.error ?? 'Couldn’t join. Try again.', true);
      syncJoinButton();
      return;
    }
    guest = { token: data.token, slot: data.slot, name: data.name };
    saveGuest(guest);
    showJoined();
  } catch {
    setHelp('Can’t reach the PC. Are you on the same Wi-Fi?', true);
    syncJoinButton();
  }
});

$('joined-open').addEventListener('click', () => pad.open());
$('leave').addEventListener('click', () => {
  const token = guest?.token;
  guest = null;
  saveGuest(null);
  if (token) fetch('/api/leave', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) }).catch(() => {});
  showJoin();
});
document.addEventListener('visibilitychange', () => pad.sync());

// A QR code or shared link carries the code after the #. It's filled in, then
// taken out of the address so it isn't left in the browser's history.
const linkCode = decodeURIComponent(location.hash.slice(1)).toUpperCase().replace(CODE_LETTERS, '').slice(0, 4);
if (linkCode) {
  $('code').value = linkCode;
  history.replaceState(null, '', location.pathname);
}
fetch('/api/info').then((r) => r.json()).then((info) => {
  $('join-pc').textContent = `on ${info.pc}`;
  if (!info.party && !guest) setHelp('There’s no game right now. Ask the host to start one.', true);
}).catch(() => {});

if (guest) showJoined();
else showJoin();
</script>
</body>
</html>
