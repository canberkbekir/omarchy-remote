<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connect your phone</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/icon-180.png">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/user.css">
</head>
<body>

<main class="screen connect">
  <div class="qr-main">
    <div class="qr-text">
      <h2 id="title">Connect your phone</h2>
      <p id="hint" aria-live="polite">Loading…</p>
    </div>
    <div class="qr-card" id="qr-card" hidden><svg id="qr-svg" role="img" aria-label="QR code for the app's address"></svg></div>
    <div class="qr-fallback" id="fallback" hidden>
      <p><span id="label"></span>: <span class="qr-link" id="url"></span></p>
      <button class="key wide" type="button" id="reveal"><span>Show passcode</span><span class="value" id="passcode" hidden></span></button>
    </div>
  </div>
</main>

<script src="/connect.js"></script>
</body>
</html>
